<style>

html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}

:root[data-theme="dark"]{--bg:#16140f;--card:#211e17;--tx:#f3eee3;--mu:#a59c8c;--ac:#f07a68;--ac2:#3a2420;--bd:#352f24;--sh:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Zen Maru Gothic",-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;max-width:600px;margin:0 auto;padding:12px 14px 96px;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}

.w:first-child{border-top:0}.w:active{background:var(--ac2)}
.wl{flex:1;min-width:0}.jp{font-size:22px;font-weight:700;line-height:1.2}.rd{color:var(--mu);font-size:13px}

.or{color:var(--mu);text-align:center;font-size:13px;margin:14px 0 8px}

.note{color:var(--mu);font-size:14px;margin:8px 2px}
.fc{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;margin:14px 0;cursor:pointer;gap:6px}
.fc .jp{font-size:54px}.fc .bk{font-size:24px;font-weight:700}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}

nav div{display:flex;width:100%;max-width:600px}
nav button{flex:1;background:none;border:0;padding:9px 0 8px;color:var(--mu);font-size:12px;font-weight:700}
nav button i{display:block;font-style:normal;font-size:22px}nav button.on{color:var(--ac)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden],#toast[hidden]{display:none}
#sheet>div{background:var(--bg);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;display:flex;gap:12px;align-items:center;max-width:92%}
#toast button{background:none;border:0;color:var(--ac);font-weight:700}
.sel{display:flex;gap:8px;margin:6px 0}.sel .fld{padding:9px 10px}
.srch{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding:2px 0 6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:6}
.tl{padding:4px 0}.tl .chip{font-size:13px;padding:5px 10px}
.kg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}.kc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center}.kc b{font-size:26px}.kc small{color:var(--mu);font-size:12px}.kc:active{background:var(--ac2)}
.gh>.dot{margin-left:0}.btn:active{transform:scale(.98)}.fc{animation:pop .18s ease}@keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}
nav button i{width:58px;margin:0 auto 2px;border-radius:14px;padding:1px 0}nav button.on i{background:var(--ac2)}
.hero{display:flex;align-items:center;gap:16px;padding:16px;margin-bottom:10px}.ring{position:relative;width:104px;height:104px;flex:none}.rn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.rn b{font-size:26px;line-height:1}.rn small{font-size:11px;color:var(--mu)}.due b{font-size:36px;line-height:1}.due{margin-bottom:8px;color:var(--mu)}
