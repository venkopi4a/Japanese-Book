  try{for(let i=0;i<files.length;i++){busy=`Reading photo ${i+1} of ${files.length}…`;render();
    const r=await sample.json(PROMPT("This image shows a beginner Japanese learner’s handwritten or typed vocabulary list (from Duolingo).",""),{images:[await shrink(files[i])],cache:false});all.push(...(Array.isArray(r)?r:r.words||[]))}
    finish(all)}catch(e){fail(e)}
  busy="";render();
}
async function translate(){
  const t=$("#tx").value.trim();if(!t||!sample)return;err="";busy="Translating & sorting…";render();
  try{const r=await sample.json(PROMPT("Here are Japanese words from a learner (romaji, kana, kanji or English-only; one per line):\n"+t+"\n"," — for English-only lines, give the Japanese word"),{cache:false});finish(Array.isArray(r)?r:r.words||[])}catch(e){fail(e)}
  busy="";render();
}

  :`<div class="dbar"><button class="x" data-a="dclose">‹ Back</button><span><button class="ib" data-a="dstar" aria-label="Favourite">${w.star?"★":"☆"}</button><button class="x" data-a="dedit" style="color:var(--ac);font-weight:700">Edit</button></span></div><div class="page">
  <div class="dword">${esc(w.jp)}</div><div class="dread">${esc(w.reading||"")}<button class="ib" data-a="say" data-t="${esc(w.reading||w.jp)}" aria-label="Play">🔊</button></div>${w.romaji?`<div class="rd">${esc(w.romaji)}</div>`:""}<div class="dmean">${esc(w.en)}</div>
  <div class="meta">${metaRow("Part of speech",w.pos)}${metaRow("Topic",w.group)}${metaRow("Duolingo unit",w.lesson)}${metaRow("JLPT level",w.jlpt)}</div>
  <h3>Examples</h3><div class="ruled">${w.ex.length?w.ex.map(e=>`<p><span class="ja">${hl(e.ja)}</span><br><span class="rd">${esc(e.en)}</span></p>`).join(""):`<p class="rd">No example yet. Add one with Edit, or send this word to Claude and import the result.</p>`}</div>
  <h3>Progress</h3><div class="meta">${SKILLS.map(k=>{const s=w.p[k];return `<div class="mr"><span>${SKN[k]}</span><b class="dt">${s?dots(s.b):"not started"}</b></div>`}).join("")}</div>${w.notes?`<h3>Notes</h3><p>${esc(w.notes)}</p>`:""}</div>`;
  d.hidden=false;d.scrollTop=0}
/* ===== v5: import, export, settings ===== */
function fromV1(o){return norm({id:o.id||null,jp:S(o.jp),reading:S(o.reading),romaji:S(o.romaji),en:S(o.en),pos:S(o.pos),group:S(o.topic||o.group)||"Unsorted",tags:Array.isArray(o.tags)?o.tags:[],lesson:S(o.unit||o.lesson),jlpt:/^N[1-5]$/.test(o.jlpt)?o.jlpt:"",ex:(o.examples||o.ex||[]).filter(e=>e&&e.ja).map(e=>({ja:S(e.ja),en:S(e.en)})),notes:S(o.notes),src:S(o.source||o.src),added:o.added||Date.now(),mod:o.modified||o.mod||0,edited:!!o.edited})}
const toV1=w=>({id:w.id,jp:w.jp,reading:w.reading,romaji:w.romaji,en:w.en,pos:w.pos,topic:w.group,tags:w.tags,unit:w.lesson,jlpt:w.jlpt,examples:w.ex,notes:w.notes,source:w.src,added:w.added,modified:w.mod||0,edited:!!w.edited});
const pkg=full=>JSON.stringify({format:"japanese-book",version:1,exported:new Date().toISOString(),words:words.map(toV1),...(full?{progress:words.map(w=>({id:w.id,star:!!w.star,skills:w.p||{}}))}:{})},null,1);
function dlf(name,text){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}}
function parseImp(t){t=t.trim();if(!t)return[];let a;if(t[0]==="{"||t[0]==="["){try{const j=JSON.parse(t);a=Array.isArray(j)?j:j.words}catch(e){return null}a=(a||[]).map(fromV1)}else a=t.split("\n").map(l=>l.split("|").map(x=>x.trim())).filter(p=>p[0]).map(p=>fromV1({jp:p[0],reading:p[1],romaji:p[2],en:p[3],topic:p[4],unit:p[5]}));
  const seen=new Set();return a.filter(x=>{if(!x.jp)return false;const k=x.jp+"|"+x.reading;if(seen.has(k))return false;seen.add(k);return true})}
const findW=x=>words.find(w=>x.id&&w.id===x.id)||words.find(w=>w.jp===x.jp&&(!x.reading||!w.reading||w.reading===x.reading)),IMPF=["reading","en","pos","group","lesson","jlpt","notes","romaji"];
const sheet=(t,sub,inner)=>{const e=$("#sheet");e.innerHTML=`<div><b>${t}</b><p class="note" style="margin:0">${sub}</p>${inner}</div>`;e.hidden=false};
const fileIn=t=>`<label class="chip" style="width:fit-content">Choose a file<input type="file" accept=".json,.txt,application/json,text/plain" hidden data-a="file" data-t="${t}"></label>`;
function showPrev(){const {news,dups}=imp5,d=dups.filter(x=>x.diff.length);imp5.d=d;
  sheet("Import preview",`${news.length} new, ${dups.length} already saved${d.length?", "+d.length+" differ":""}. Nothing you wrote is overwritten unless you switch it on.`,
  `${news.length?`<div class="mini">${news.slice(0,8).map(x=>`<div>${esc(x.jp)} <span class="rd">${esc(x.en)}</span></div>`).join("")}${news.length>8?`<div class="rd">and ${news.length-8} more</div>`:""}</div>`:""}${d.map((o,i)=>o.diff.map((df,j)=>`<div class="dif"><div>${esc(o.m.jp)} <span class="rd">${df.f}</span></div><div class="rd">Yours: ${esc(df.mine)}</div><button class="chip ${df.use?"on":""}" data-a="usd" data-i="${i}" data-j="${j}">${df.use?"Using":"Use"}: ${esc(df.theirs)}</button></div>`).join("")).join("")}
  <div style="display:flex;gap:8px"><button class="btn" data-a="imok">${news.length?"Add "+news.length+" word"+(news.length==1?"":"s"):"Apply"}</button><button class="btn s" style="width:auto" data-a="close">Cancel</button></div>`)}
const row=(t,d,a,l)=>`<div class="mr"><div><b>${t}</b><div class="rd" style="text-align:left">${d}</div></div><button class="chip" data-a="${a}">${l}</button></div>`;
function settings(){const th=(()=>{try{return localStorage.getItem("jptheme")||"auto"}catch(e){return"auto"}})();
  return `<h2 class="sh">Vocabulary</h2><div class="meta">${row("Import words","Paste a package from Claude, or choose a file","imp","Import")}${row("Export vocabulary","Words only, to add to the online notebook","exv","Save file")}</div>
  <h2 class="sh">Backup</h2><div class="meta">${row("Full backup","Words and study progress in one file","exf","Save file")}${row("Copy backup","Copy the same data to paste into Notes","bk","Copy")}${row("Restore","Replace this notebook from a backup","rs","Restore")}</div>
  <h2 class="sh">Sound</h2><div class="meta">${row("Auto-play pronunciation","Plays when you reveal or answer","auto",auto?"On":"Off")}</div>${voiceUI()}
  <h2 class="sh">Appearance</h2><div class="chips">${["auto","light","dark"].map(x=>`<button class="chip ${th===x?"on":""}" data-a="theme" data-v="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")}</div>
  <h2 class="sh">Storage</h2><div class="meta"><div class="mr"><span>Words on this device</span><b>${words.length}</b></div><div class="mr"><span>Database</span><b>${idb?"IndexedDB":"Not available"}</b></div><div class="mr"><span>Protected from clean-up</span><b>${persisted===true?"Yes":persisted===false?"Not guaranteed":"Unknown"}</b></div></div><div class="note">Version ${BUILD}. Works offline after the first load.</div>`}
Object.assign(A,{
 edit:t=>detail(t.dataset.id),
 "new":()=>{const w=norm({id:uid(),jp:"",added:Date.now(),src:"manual"});words.unshift(w);detail(w.id,true)},
 dclose:()=>{$("#detail").hidden=true;render()},
 dedit:()=>detail(dId,true),
 dcancel:()=>{const w=words.find(x=>x.id===dId);if(w&&!w.jp)words=words.filter(x=>x!==w);if(w&&w.jp)detail(dId);else{$("#detail").hidden=true}render()},
 dstar:()=>{const w=words.find(x=>x.id===dId);w.star=!w.star;save();detail(dId)},
 dsave:()=>{const w=words.find(x=>x.id===dId),v=i=>$("#"+i).value.trim();w.jp=v("f_jp");if(!w.jp){words=words.filter(x=>x!==w);$("#detail").hidden=true;render();toast("A word needs Japanese text");return}
  w.reading=v("f_rd");w.romaji=v("f_ro");w.en=v("f_en");w.pos=v("f_pos");w.group=v("f_g")||"Unsorted";w.lesson=v("f_u");w.jlpt=v("f_j");w.notes=v("f_no");
  w.ex=v("f_ex").split("\n").map(l=>l.split("|").map(x=>x.trim())).filter(p=>p[0]).map(p=>({ja:p[0],en:p[1]||""}));w.edited=true;w.mod=Date.now();save();detail(dId);render()},
 ddel:()=>{if(!confirm("Delete this word?"))return;const i=words.findIndex(x=>x.id===dId),w=words[i];words.splice(i,1);$("#detail").hidden=true;fixGf();save();render();toast("Deleted “"+w.jp+"”",()=>{words.splice(i,0,w);save();render()})},
 imp:()=>sheet("Import words","Paste a package from Claude (JSON), or lines like: Japanese | reading | romaji | English | topic | unit",`<textarea class="fld" id="imt" rows="7" autocapitalize="off" spellcheck="false"></textarea>${fileIn("imt")}<div style="display:flex;gap:8px"><button class="btn" data-a="imgo">Preview</button><button class="btn s" style="width:auto" data-a="close">Cancel</button></div>`),
 imgo:()=>{const a=parseImp($("#imt").value);if(!a||!a.length){toast("Nothing readable found. Check the format.");return}
  const news=[],dups=[];a.forEach(x=>{const m=findW(x);if(!m){news.push(x);return}const fill=[],diff=[];
   for(const f of IMPF){const mine=m[f]||"",th=x[f]||"";if(!th||mine===th)continue;if(!mine||(f==="group"&&mine==="Unsorted"))fill.push(f);else diff.push({f,mine,theirs:th,use:false})}
   if(!m.ex.length&&x.ex.length)fill.push("ex");dups.push({m,x,fill,diff})});imp5={news,dups};showPrev()},
 usd:t=>{const df=imp5.d[+t.dataset.i].diff[+t.dataset.j];df.use=!df.use;showPrev()},
 imok:()=>{const {news,dups}=imp5;let c=0;dups.forEach(o=>{o.fill.forEach(f=>{o.m[f]=o.x[f];c++});o.diff.filter(d=>d.use).forEach(d=>{o.m[d.f]=d.theirs;c++});if(o.fill.length||o.diff.some(d=>d.use))o.m.mod=Date.now()});
  news.forEach((x,i)=>{words.unshift({...x,id:x.id||uid(),src:x.src||"import",added:Date.now()+i})});save();$("#sheet").hidden=true;render();toast(news.length?"Added "+news.length+" words":c?"Updated "+c+" fields":"Nothing changed")},
 exv:()=>{dlf("japanese-book-words.json",pkg(false));toast("Vocabulary file saved")},
 exf:()=>{dlf("japanese-book-backup-"+today()+".json",pkg(true));toast("Backup file saved")},
 bk:async()=>{const j=pkg(true);try{await navigator.clipboard.writeText(j);toast("Backup copied. Paste it into Notes.")}catch(e){prompt("Copy this backup:",j)}},
 rs:()=>sheet("Restore backup","Paste a backup or choose a file. This replaces your current notebook.",`<textarea class="fld" id="rst" rows="6" spellcheck="false"></textarea>${fileIn("rst")}<div style="display:flex;gap:8px"><button class="btn" data-a="rsgo">Restore</button><button class="btn s" style="width:auto" data-a="close">Cancel</button></div>`),
 rsgo:()=>{try{const j=JSON.parse($("#rst").value.trim());let nw;if(Array.isArray(j))nw=j.map(fromLegacy);else if(j.format==="japanese-book"){const pm=new Map((j.progress||[]).map(x=>[x.id,x]));nw=(j.words||[]).map(o=>{const w=fromV1(o);w.id=o.id||uid();const pr=pm.get(w.id);if(pr){w.p=pr.skills||{};w.star=!!pr.star}return w})}else throw 0;
   if(!nw.length||!nw[0].jp)throw 0;if(!confirm("Replace this notebook with "+nw.length+" words?"))return;words=nw;save();$("#sheet").hidden=true;render();toast("Restored "+nw.length+" words")}catch(e){toast("That isn’t a valid backup")}},
 theme:t=>{const v=t.dataset.v;try{v==="auto"?localStorage.removeItem("jptheme"):localStorage.setItem("jptheme",v)}catch(e){}if(v==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=v;render()},
 go:t=>{const m=t.dataset.m||"auto";let l=m==="hard"?words.filter(hard):words.filter(isDue);if(!l.length&&m!=="hard")l=[...words];if(m==="mcr")l=l.filter(w=>w.reading);if(l.length<2){toast(m==="hard"?"No difficult words yet":"Add more words first");return}l.sort(()=>Math.random()-.5);l=l.slice(0,25);st={queue:l,total:l.length,n:0,dir:m==="auto"||m==="hard"?"mc":m,auto:m==="auto"||m==="hard",hard:m==="hard"};view="study";prep();render();scrollTo(0,0)},
 start:()=>{const g=$("#sg").value,m=$("#sd").value;let l=words.filter(w=>g==="__due"?isDue(w):g==="All"?true:g==="★"?w.star:g.startsWith("u:")?w.lesson===g.slice(2):grp(w)===g);if(m==="mcr")l=l.filter(w=>w.reading);if(l.length<2){toast("Pick a set with at least 2 words");return}l.sort(()=>Math.random()-.5);l=l.slice(0,g==="__due"?25:40);st={queue:l,total:l.length,n:0,dir:m==="auto"?"mc":m,auto:m==="auto"};prep();render()},
 opt:t=>{if(st.pick!=null)return;const w=st.queue[0],i=+t.dataset.i;st.pick=i;render();if(auto&&st.dir!=="listen")say(w.reading||w.jp);setTimeout(()=>{if(st&&st.queue&&st.queue[0]===w)rate(st.opts[i]===st.ans)},1000)},
 pm:()=>{const l=[...st.miss].sort(()=>Math.random()-.5),d=st.dir,a=st.auto;st={queue:l,total:l.length,n:0,dir:d||"mc",auto:a};prep();render()}
});
document.addEventListener("change",e=>{const t=e.target;if(t.type==="file"&&t.dataset.a==="file"){const f=t.files[0];if(f)f.text().then(x=>{$("#"+t.dataset.t).value=x})}});
$("#detail").onclick=app.onclick;
init();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register("sw.js").catch(()=>{});navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had)toast("Updated. Reopen the app to see the new version.")})}
</script></body></html>
